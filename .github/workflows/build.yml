name: build

on:
  push:
  pull_request:

jobs:
  test-on-openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run the real test suite inside an OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            true
          run: |
            cc -Wall -Wextra -o pledge-exec pledge-exec.c
            ./test.sh
